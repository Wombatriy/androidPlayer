name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: |
          # local.properties contains a developer-specific SDK path when committed.
          rm -f local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
